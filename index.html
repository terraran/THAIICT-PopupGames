*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Kanit,'Noto Sans Thai',Tahoma,sans-serif}
body{user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;display:grid;grid-template-rows:62px 1fr}
header{background:var(--accent);color:#fff;padding:0 22px;display:flex;align-items:center;gap:14px}
header h1{margin:0;font-size:28px;font-weight:800;white-space:nowrap}
.steps{margin-left:auto;display:flex;gap:6px}
.st{background:#ffffff33;border-radius:30px;padding:3px 12px;font-size:16px;white-space:nowrap}
.st.on{background:#fff;color:var(--accent);font-weight:800}
.lang{display:flex;border:2px solid #fff;border-radius:30px;overflow:hidden}
.lang button{background:transparent;box-shadow:none;border-radius:0;padding:2px 12px;font-size:16px;color:#fff}
.lang button.on{background:#fff;color:var(--accent)}
.body{display:grid;grid-template-columns:560px 1fr;gap:16px;padding:14px 16px;min-height:0}
.body.full{grid-template-columns:1fr}
.full #poolWrap{display:none}
#poolWrap{min-height:0;display:flex}
.pool{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;background:#fff8;border:3px dashed var(--line);border-radius:14px;padding:10px;overflow:auto}
main{display:flex;flex-direction:column;gap:10px;min-height:0}
.topbar{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;border:3px solid var(--line)}
.task{flex:1;font-size:19px;line-height:1.35}
.task b{color:var(--accent)}
.btns{display:flex;gap:8px;flex:none}
button{font-family:inherit;font-size:20px;font-weight:600;border:none;border-radius:14px;padding:8px 20px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 #0003;white-space:nowrap}
button:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ink);border:3px solid var(--line)}
.hide{display:none!important}
/* sign-in screen */
#signin{position:absolute;inset:62px 0 0 0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:30}
.signbox{width:720px;background:#fff;border-radius:28px;border:4px solid var(--accent);padding:34px 44px;box-shadow:0 20px 50px #0002}
.signbox h2{margin:0;font-size:40px;color:var(--accent)}
.signbox p{margin:6px 0 18px;font-size:22px;color:var(--muted)}
.signbox label{display:block;font-size:20px;margin:14px 0 4px;font-weight:600}

.signbox button{width:100%;margin-top:26px;font-size:28px;padding:14px}

.cardx.sel{outline:4px solid #fbbf24}
.cardx.hes{outline:5px solid #f59e0b;background:#fffbeb}
.pickmode .cardx{cursor:pointer}
.pickmode .cardx:hover{outline:4px solid #fde68a}
.cardx.drag{position:absolute;z-index:50;cursor:grabbing;box-shadow:0 12px 26px #0004;pointer-events:none}
.cardx .ic{font-size:26px;line-height:1;flex:none}
.cardx .bd{flex:1;min-width:0}
.cardx .tx{font-size:17px;font-weight:600}
.full .cardx .tx{font-size:18px}
.cardx .nm{font-size:13px;color:var(--muted)}

.chip.right{background:#bbf7d0;border-color:#16a34a}
.chip.wrong{background:#fecaca;border-color:#dc2626;text-decoration:line-through}
.chip.miss{border:2px dashed #16a34a;background:#f0fdf4;color:#15803d}

.mark.ok{background:#16a34a}.mark.no{background:#dc2626}
.exp{display:none;font-size:14px;color:#334155;margin-top:4px;background:#f1f5f9;border-radius:8px;padding:3px 8px;line-height:1.3}
.checked .cardx.bad .exp{display:block}

.root:after{content:'';position:absolute;top:100%;left:50%;width:4px;height:12px;background:var(--ink)}

.bin .cardx{width:calc(50% - 4px);flex:none}

.drawer{background:#fff;border-radius:14px;border:3px solid #f59e0b;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr auto;gap:10px 16px;align-items:start}
.drawer .hd{grid-column:1/4;font-size:18px}

.drawer label{font-size:16px;font-weight:600;display:block;margin-bottom:3px}
.drawer label small{font-weight:400;color:var(--muted)}
.drawer textarea{height:72px;resize:none;font-size:19px}
.drawer .go{align-self:end}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;border:3px solid var(--line);padding:8px 14px}
.res .r{font-size:24px;font-weight:800;white-space:nowrap}
.res .k{font-size:18px;background:#fef9c3;border-radius:10px;padding:6px 12px}
.res .sent{font-size:16px;font-weight:600;margin-top:4px}
.sent.ok{color:#166534}.sent.err{color:#991b1b}.sent.wait{color:#075985}

const plain = h => String(h).replace(/<[^>]+>/g, '');

function fit(){ scale = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${scale})`;
  stage.style.left = ((innerWidth - 1600 * scale) / 2) + 'px'; stage.style.top = ((innerHeight - 900 * scale) / 2) + 'px'; }
addEventListener('resize', fit); fit();
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cardOf = id => document.querySelector(`.cardx[data-id="${id}"]`);

function cardEl(c){
  const d = document.createElement('div'); d.className = 'cardx'; d.dataset.id = c.id;
  d.innerHTML = (c.icon ? `<div class="ic">${c.icon}</div>` : '') + `<div class="bd">` + (c.who ? `<div class="nm">💬 ${c.who}</div>` : '') +
    `<div class="tx"></div><div class="chips">${C.signs.map((s, i) => `<span class="chip" data-s="${i + 1}"></span>`).join('')}</div><div class="exp"></div></div>`;
  d.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', e => {
    if (step !== 2 || checked) return;
    e.stopPropagation(); const set = signs[c.id] || (signs[c.id] = new Set()); const n = +ch.dataset.s;
    set.has(n) ? set.delete(n) : set.add(n); ch.classList.toggle('on', set.has(n)); update();
  }));
  d.addEventListener('pointerdown', e => startDrag(e, d));
  d.addEventListener('click', () => { if (step === 3 && !checked) { hes = c.id; document.querySelectorAll('.cardx.hes').forEach(x => x.classList.remove('hes')); d.classList.add('hes'); $('#drawer').classList.remove('hide'); applyLang(); update(); setTimeout(() => $('#reason').focus(), 50); } });
  return d;
}

function applyLang(){
  const U = UI[L]; document.documentElement.lang = L;
  $('#lth').classList.toggle('on', L === 'th'); $('#len').classList.toggle('on', L === 'en');
  $('#ttl').textContent = t(C.title); document.title = t(C.title);
  U.steps.forEach((s, i) => $('#s' + i).textContent = s);
  $('#sTitle').textContent = t(C.title); $('#sSub').textContent = U.sub; $('#start').textContent = U.start;
  $('#lRoom').textContent = U.room; $('#lN1').textContent = U.n1; $('#lN2').textContent = U.n2;
  const rv = $('#room').value; $('#room').innerHTML = `<option value="">${U.pickRoom}</option>` + C.rooms.map(r => `<option>${r}</option>`).join(''); $('#room').value = rv;
  let task = step ? t(C['task' + step]) : '';
  if (step === 3) task += hes ? '' : `<br><b>${U.pickHint}</b>`;
  if (checked) task = `<b>${U.round(round)}</b> · ${U.doneTask}`;
  $('#task').innerHTML = task;
  $('#root').textContent = t(C.root); $('#binA').textContent = t(C.binA); $('#binB').textContent = t(C.binB);
  $('#back').textContent = U.back; $('#next').textContent = U.next; $('#check').textContent = U.check; $('#reset').textContent = U.reset; $('#edit').textContent = U.edit;
  const hc = C.cards.find(c => c.id === hes); $('#hesTxt').innerHTML = `${U.picked} <b>${hc ? plain(t(hc.text)) : ''}</b>`;
  $('#lReason').textContent = U.reason; $('#reason').placeholder = U.reasonPh;
  $('#lFr').innerHTML = `${U.fr} <small>${U.frOpt}</small>`; $('#fr').placeholder = U.frPh;
  C.cards.forEach(c => {
    const el = cardOf(c.id); if (!el) return;
    el.querySelector('.tx').innerHTML = t(c.text);
    el.querySelectorAll('.chip').forEach(ch => ch.textContent = t(C.signs[ch.dataset.s - 1].short));
    el.querySelector('.exp').innerHTML = checked ? (placed[c.id] === c.bin ? '' : `<b>${U.should} "${t(c.bin === 'a' ? C.binA : C.binB)}"</b> · `) + t(c.why) : '';
  });
  if (checked) { $('#result').textContent = U.result(score(), C.cards.length); $('#think').innerHTML = t(C.think); showSent(); }
}
$('#lth').onclick = () => { L = 'th'; applyLang(); }; $('#len').onclick = () => { L = 'en'; applyLang(); };

// ---- drag (mouse + touch, scaled stage) and tap-to-place ----
let drag = null;
function startDrag(e, el){
  if (step !== 1 || e.target.classList.contains('chip')) return;
  e.preventDefault();
  const r = el.getBoundingClientRect();
  drag = { el, ox: (e.clientX - r.left) / scale, oy: (e.clientY - r.top) / scale, sx: e.clientX, sy: e.clientY, moved: false, w: r.width / scale, home: el.parentNode, next: el.nextSibling };
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp, { once: true });
}
function binAt(x, y){ return [...document.querySelectorAll('.bin')].find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }); }
function onMove(e){
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
  if (!drag.moved) { drag.moved = true; drag.el.classList.add('drag'); drag.el.style.width = drag.w + 'px'; stage.appendChild(drag.el); }
  const sr = stage.getBoundingClientRect();
  drag.el.style.left = ((e.clientX - sr.left) / scale - drag.ox) + 'px'; drag.el.style.top = ((e.clientY - sr.top) / scale - drag.oy) + 'px';
  document.querySelectorAll('.bin').forEach(b => b.classList.toggle('hover', b === binAt(e.clientX, e.clientY)));
}
function onUp(e){
  removeEventListener('pointermove', onMove);
  const d = drag; drag = null; if (!d) return;
  document.querySelectorAll('.bin').forEach(b => b.classList.remove('hover'));
  if (!d.moved) { document.querySelectorAll('.cardx.sel').forEach(x => x !== d.el && x.classList.remove('sel')); d.el.classList.toggle('sel'); sel = d.el.classList.contains('sel') ? d.el : null; return; }
  const b = binAt(e.clientX, e.clientY);
  d.el.classList.remove('drag'); d.el.style.cssText = '';
  if (b) place(d.el, b);
  else if (d.home === pool) pool.insertBefore(d.el, d.next && d.next.parentNode === pool ? d.next : null);
  else { pool.appendChild(d.el); delete placed[d.el.dataset.id]; update(); }
}
document.querySelectorAll('.bin').forEach(b => b.addEventListener('click', e => { if (e.target.closest('.cardx')) return; if (sel && step === 1) { place(sel, b); sel.classList.remove('sel'); sel = null; } }));
pool.addEventListener('click', e => { if (sel && e.target === pool) { pool.appendChild(sel); delete placed[sel.dataset.id]; sel.classList.remove('sel'); sel = null; update(); } });
function place(el, bin){ bin.querySelector('.list').appendChild(el); placed[el.dataset.id] = bin.dataset.bin; update(); }

function update(){
  $('#start').disabled = !($('#room').value && $('#n1').value.trim());
  if (step === 1) $('#next').disabled = Object.keys(placed).length !== C.cards.length;
  if (step === 2) $('#next').disabled = !C.cards.filter(c => placed[c.id] === 'b').every(c => signs[c.id] && signs[c.id].size);
  $('#check').disabled = sending || !(hes && $('#reason').value.trim().length >= 5);
}
['#room', '#n1'].forEach(s => { $(s).addEventListener('change', update); $(s).addEventListener('input', update); });
$('#reason').addEventListener('input', update);

function setStep(n){
  step = n; [0, 1, 2, 3].forEach(i => $('#s' + i).classList.toggle('on', i === n));
  $('#signin').classList.toggle('hide', n !== 0);
  app.classList.toggle('full', n >= 2); app.classList.toggle('pickmode', n === 3 && !checked);
  $('#next').classList.toggle('hide', n === 3); $('#back').classList.toggle('hide', checked);
  $('#drawer').classList.toggle('hide', !(n === 3 && hes && !checked));
  $('#res').classList.toggle('hide', !checked);
  if (n === 2) C.cards.forEach(c => { if (placed[c.id] !== 'b') delete signs[c.id]; const el = cardOf(c.id); el && el.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('on', !!(signs[c.id] && signs[c.id].has(+ch.dataset.s)))); });
  applyLang(); update();
}
$('#start').onclick = () => setStep(1);
$('#next').onclick = () => setStep(step + 1);
$('#back').onclick = () => setStep(step - 1);

const score = () => C.cards.filter(c => placed[c.id] === c.bin).length;
function showSent(){ const U = UI[L], s = $('#sent'); s.className = 'sent ' + sendState;
  s.textContent = sendState === 'ok' ? U.ok + (ENDPOINT.startsWith('http') ? '' : ' ' + U.noEnd) : sendState === 'err' ? U.err : sendState === 'wait' ? U.wait : ''; }

function buildRow(){
  const th = o => (o && typeof o === 'object') ? o.th : o;
  const wrong = C.cards.filter(c => placed[c.id] !== c.bin).map(c => plain(th(c.text)));
  const inB = C.cards.filter(c => placed[c.id] === 'b');
  const exact = inB.filter(c => c.bin === 'b' && [...(signs[c.id] || [])].sort().join() === (c.signs || []).slice().sort().join()).length;
  const chosen = inB.map(c => plain(th(c.text)) + ' = ' + [...(signs[c.id] || [])].sort().map(n => plain(th(C.signs[n - 1].short))).join(', ')).join(' | ');
  const hc = C.cards.find(c => c.id === hes);
  const names = [$('#n1').value.trim(), $('#n2').value.trim()].filter(Boolean).join(' + ');
  const sg = {}; inB.forEach(c => sg[c.id] = [...(signs[c.id] || [])].sort());
  const fr = $('#fr').value.trim();
  const data = { v: 2, act: C.act, round, place: placed, signs: sg, hes, reason: $('#reason').value.trim(), fr };
  return [C.level, C.week, th(C.title), $('#room').value, names, L.toUpperCase(), `${score()}/${C.cards.length}`,
          wrong.join(' | ') || '-', `${exact}/${C.cards.filter(c => c.bin === 'b').length}`, chosen, hc ? plain(th(hc.text)) : '', $('#reason').value.trim(), JSON.stringify(data), fr || '-', round];
}
async function send(){
  sending = true; update(); sendState = 'wait'; showSent();
  if (!ENDPOINT.startsWith('http')) { sendState = 'ok'; sending = false; showSent(); return; }
  try { await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ row: buildRow() }) }); sendState = 'ok'; }
  catch (e) { sendState = 'err'; }
  sending = false; showSent();
  if (sendState === 'err') { checked = false; setStep(3); }
}
$('#check').onclick = () => {
  checked = true;
  C.cards.forEach(c => {
    const el = cardOf(c.id), right = placed[c.id] === c.bin;
    el.classList.add(right ? 'good' : 'bad'); el.insertAdjacentHTML('beforeend', `<div class="mark ${right ? 'ok' : 'no'}">${right ? '✓' : '✗'}</div>`);
    if (placed[c.id] === 'b') el.querySelectorAll('.chip').forEach(ch => {
      const n = +ch.dataset.s, chosen = signs[c.id] && signs[c.id].has(n), should = (c.signs || []).includes(n);
      if (chosen && should) ch.classList.add('right'); else if (chosen) ch.classList.add('wrong'); else if (should) ch.classList.add('miss');
    });
  });
  app.classList.add('checked'); setStep(3); send();
};
$('#edit').onclick = () => {
  checked = false; round++; app.classList.remove('checked'); sendState = '';
  document.querySelectorAll('.mark').forEach(m => m.remove());
  document.querySelectorAll('.cardx').forEach(el => el.classList.remove('good', 'bad'));
  document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('right', 'wrong', 'miss'));
  setStep(1);
};
$('#reset').onclick = () => { if (confirm(UI[L].confirmReset)) location.reload(); };

shuffle(C.cards).forEach(c => pool.appendChild(cardEl(c)));
setStep(0);
</script>

:15;font-size:52px;font-weight:800;color:#fff;text-shadow:0 5px 0 #0007;pointer-events:none;animation:zt 2.4s ease-out forwards}\n@keyframes zt{0%{opacity:0;transform:translate(-50%,20px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}\n/* popups */\n.pop{position:absolute;width:420px;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px #0008;z-index:10;animation:popin .25s ease-out}\n@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}\n.pop.out{animation:popout .2s ease-in forwards}\n@keyframes popout{to{transform:scale(.2);opacity:0}}\n.pop .bar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px 5px 16px;font-size:16px}\n.pop .realx{font-family:inherit;border:none;background:#ffffff33;color:inherit;opacity:.9;font-size:17px;cursor:pointer;padding:2px 8px;border-radius:8px}\n.pop.tiny .realx{font-size:13px;padding:0 5px;opacity:.7}\n.pop .content{padding:14px 22px 16px;text-align:center;position:relative}\n.trick{background:linear-gradient(160deg,#fde047,#f97316 70%,#ec4899);color:#fff;border:6px solid #fff}\n.trick .bar{background:#0002;color:#fff}\n.trick .ic{font-size:64px;line-height:1;animation:wig 1s ease-in-out infinite}\n@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}\n.trick h3{margin:6px 0 2px;font-size:28px;font-weight:800;text-shadow:0 3px 0 #9a341288;line-height:1.2}\n.bait{margin-top:10px;font-family:inherit;font-size:28px;font-weight:800;color:#fff;border:5px solid #fff;border-radius:18px;padding:6px 28px;background:linear-gradient(#4ade80,#16a34a);box-shadow:0 7px 0 #14532d;cursor:pointer;animation:pulse .8s ease-in-out infinite}\n@keyframes pulse{50%{transform:scale(1.07)}}\n.fakex{position:absolute;width:50px;height:50px;border-radius:50%;background:#ef4444;color:#fff;border:4px solid #fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #7f1d1d}\n.nothanks{display:block;margin:10px auto 0;font-family:inherit;border:none;background:none;color:#fff;opacity:.85;font-size:16px;text-decoration:underline;cursor:pointer}\n.pop.tiny .nothanks{font-size:13px;opacity:.7}\n.safe{background:#fff;color:#1e293b;border:5px solid #334155}\n.safe .bar{background:#334155;color:#fff}\n.safe .ic{font-size:50px;line-height:1}\n.safe h3{margin:8px 0 4px;font-size:26px;font-weight:600}\n.ok{margin-top:8px;font-family:inherit;font-size:24px;font-weight:600;border:none;border-radius:14px;padding:6px 32px;background:#334155;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0f172a}\n.toast{position:absolute;z-index:30;font-size:28px;font-weight:800;padding:8px 22px;border-radius:18px;pointer-events:none;animation:fly 1.4s ease-out forwards;white-space:nowrap}\n.toast.good{background:#16a34a;color:#fff}.toast.bad{background:#dc2626;color:#fff}\n@keyframes fly{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.05);opacity:1}100%{transform:translate(-50%,-90px);opacity:0}}\n.shake{animation:shake .35s}\n@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}\n/* screens */\n.screen{position:absolute;inset:0;background:#0c4a6ecc;z-index:40;display:flex;align-items:center;justify-content:center}\n.box{width:1080px;background:#fff;border-radius:32px;padding:30px 46px;text-align:center;box-shadow:0 30px 70px #0008;border:6px solid #f59e0b}\n.box h1{margin:0;font-size:56px;color:#ea580c;line-height:1.1}\n.box p{font-size:22px;color:#334155;margin:8px 0}\n.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0;text-align:left}\n.rule{border-radius:18px;padding:10px 14px;font-size:18px;line-height:1.35}\n.rule b{display:block;font-size:20px}\n.r0{background:#e0f2fe}.r1{background:#dcfce7}.r2{background:#fee2e2}.r3{background:#fef3c7}\n.modes{display:flex;gap:16px;justify-content:center;margin-top:8px}\n.big.hard{background:linear-gradient(#f87171,#b91c1c);box-shadow:0 7px /div>\n <div class=\"pausedim hide\" id=\"dim\"><\/div><div class=\"ready hide\" id=\"ready\"><\/div>\n <div id=\"layer\"><\/div>\n <button id=\"jump\"><\/button>\n <div class=\"screen\" id=\"title\"><div class=\"box\">\n  <h1 id=\"tTitle\"><\/h1><p id=\"tSub\"><\/p>\n  <div class=\"rules\"><div class=\"rule r0\" id=\"rule0\"><\/div><div class=\"rule r1\" id=\"rule1\"><\/div><div class=\"rule r2\" id=\"rule2\"><\/div><div class=\"rule r3\" id=\"rule3\"><\/div><\/div>\n  <div class=\"modes\"><button class=\"big alt\" id=\"goE\"><\/button><button class=\"big\" id=\"goN\"><\/button><button class=\"big hard\" id=\"goH\"><\/button><\/div>\n <\/div><\/div>\n <div class=\"screen hide\" id=\"end\"><div class=\"box\">\n  <div class=\"chest\" id=\"eChest\">💰<\/div>\n  <h1 id=\"eTitle\"><\/h1>\n  <div class=\"stats\">\n   <div class=\"stat\"><div class=\"n\" id=\"eCoins\"><\/div><div class=\"l\" id=\"lCoins\"><\/div><\/div>\n   <div class=\"stat\"><div class=\"n\" id=\"eClosed\"><\/div><div class=\"l\" id=\"lClosed\"><\/div><\/div>\n   <div class=\"stat\"><div class=\"n\" id=\"eFooled\"><\/div><div class=\"l\" id=\"lFooled\"><\/div><\/div>\n  <\/div>\n  <div class=\"most\" id=\"eMost\"><\/div>\n  <div class=\"signs\" id=\"eSigns\"><\/div>\n  <div class=\"modes\"><button class=\"big\" id=\"retry\"><\/button><button class=\"big alt\" id=\"again\"><\/button><\/div>\n <\/div><\/div>\n<\/div>\n<script>\nconst $ = s => document.querySelector(s);\nconst stage = $('#stage'), layer = $('#layer'), cv = $('#cv'), g = cv.getContext('2d');\nlet L = 'th', sound = true, scale = 1;\nfunction fit(){ scale = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `scale(${scale})`; stage.style.left = ((innerWidth - 1600 * scale) / 2) + 'px'; stage.style.top = ((innerHeight - 900 * scale) / 2) + 'px'; }\naddEventListener('resize', fit); fit();\nconst T = o => o[L] || o.th;\n\n// ---------- content ----------\nconst SIGNS = [\n  { th: '🎁 ล่อด้วยรางวัลหรือของฟรี', en: '🎁 Tempts you
